<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="riegoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="canColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#riegoBg)"/>

  <!-- Regadera inclinada regando -->
  <g transform="translate(45, 40) rotate(-15)">
    <!-- Cuerpo -->
    <rect x="25" y="25" width="45" height="38" rx="10" fill="url(#canColor)"/>
    <!-- Asa -->
    <path d="M70 30 C 88 30, 88 60, 70 60" stroke="url(#canColor)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Pico vertedor -->
    <polygon points="25,45 0,22 0,14 25,37" fill="url(#canColor)"/>
    <ellipse cx="2" cy="18" rx="6" ry="10" fill="#0369a1"/>
  </g>

  <!-- Gotas de agua cayendo -->
  <g transform="translate(30, 80)">
    <path d="M12 0 C 12 0, 8 10, 8 14 A 4 4 0 0 0 16 14 C 16 10, 12 0, 12 0 Z" fill="#38bdf8"/>
    <path d="M26 12 C 26 12, 22 20, 22 24 A 4 4 0 0 0 30 24 C 30 20, 26 12, 26 12 Z" fill="#0ea5e9"/>
    <path d="M8 22 C 8 22, 5 28, 5 31 A 3 3 0 0 0 11 31 C 11 28, 8 22, 8 22 Z" fill="#38bdf8"/>
  </g>

  <!-- Plantita feliz recibiendo agua -->
  <g transform="translate(65, 95)">
    <path d="M40 45 Q 40 25, 25 15 C 38 12, 48 20, 42 45 Z" fill="#16a34a"/>
    <path d="M40 45 Q 40 20, 55 12 C 52 24, 45 28, 40 45 Z" fill="#4ade80"/>
    <ellipse cx="40" cy="45" rx="20" ry="6" fill="#78350f"/>
  </g>
</svg>
