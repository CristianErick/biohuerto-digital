<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bibBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bookBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bookOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bookGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="240" rx="20" fill="url(#bibBg)"/>

  <!-- Destellos y estrellas -->
  <polygon points="80,45 84,55 94,59 84,63 80,73 76,63 66,59 76,55" fill="#facc15"/>
  <polygon points="330,60 333,68 341,71 333,74 330,82 327,74 319,71 327,68" fill="#facc15"/>
  <circle cx="95" cy="85" r="3" fill="#38bdf8"/>
  <circle cx="310" cy="45" r="4" fill="#fb923c"/>

  <!-- Pila de libros base -->
  <g filter="url(#cardShadow)" transform="translate(110, 100)">
    <!-- Libro Inferior (Azul) -->
    <rect x="0" y="70" width="180" height="26" rx="6" fill="url(#bookBlue)"/>
    <rect x="25" y="73" width="150" height="20" rx="3" fill="#ffffff"/>
    <line x1="30" y1="78" x2="165" y2="78" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="30" y1="84" x2="140" y2="84" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="70" width="22" height="26" rx="4" fill="#0369a1"/>
    <!-- Detalle dorado en lomo -->
    <line x1="6" y1="74" x2="6" y2="92" stroke="#fde047" stroke-width="2"/>

    <!-- Libro Medio (Naranja) -->
    <rect x="15" y="44" width="160" height="24" rx="6" fill="url(#bookOrange)"/>
    <rect x="35" y="47" width="135" height="18" rx="3" fill="#ffffff"/>
    <line x1="42" y1="52" x2="160" y2="52" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="42" y1="58" x2="135" y2="58" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="15" y="44" width="20" height="24" rx="4" fill="#c2410c"/>

    <!-- Libro Superior Abierto (Verde) -->
    <g transform="translate(20, -10)">
      <!-- Lomo -->
      <path d="M70 45 L70 52 L70 45 Z" stroke="#047857" stroke-width="4"/>
      <!-- Páginas abiertas -->
      <path d="M15 35 C 40 40, 65 30, 70 45 C 75 30, 100 40, 125 35 L 125 45 C 100 50, 75 40, 70 55 C 65 40, 40 50, 15 45 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <path d="M15 28 C 40 33, 65 23, 70 38 C 75 23, 100 33, 125 28 L 125 38 C 100 43, 75 33, 70 48 C 65 33, 40 43, 15 38 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M15 20 C 40 25, 65 15, 70 30 C 75 15, 100 25, 125 20 L 125 30 C 100 35, 75 25, 70 40 C 65 25, 40 35, 15 30 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Pasta verde exterior -->
      <path d="M10 21 C 38 27, 65 16, 70 32 C 75 16, 102 27, 130 21 L 130 33 C 102 39, 75 28, 70 44 C 65 28, 38 39, 10 33 Z" fill="none" stroke="url(#bookGreen)" stroke-width="4" stroke-linecap="round"/>

      <!-- Planta que brota del libro -->
      <path d="M70 28 Q 70 10, 58 2 C 68 0, 76 8, 72 28 Z" fill="#22c55e"/>
      <path d="M70 28 Q 70 6, 82 2 C 78 12, 72 16, 70 28 Z" fill="#4ade80"/>
      <circle cx="70" cy="2" r="3" fill="#facc15"/>
    </g>
  </g>

  <!-- Globo terráqueo izquierdo -->
  <g transform="translate(50, 80)" filter="url(#cardShadow)">
    <!-- Base -->
    <path d="M25 80 L55 80 L48 70 L32 70 Z" fill="#64748b"/>
    <line x1="40" y1="70" x2="40" y2="40" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <!-- Arco -->
    <path d="M18 42 A 28 28 0 0 1 62 42" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <!-- Esfera -->
    <circle cx="40" cy="42" r="22" fill="url(#globeGrad)"/>
    <!-- Continentes verdes -->
    <path d="M30 32 Q 35 28, 42 32 Q 46 38, 40 42 Q 32 40, 30 32 Z" fill="#4ade80"/>
    <path d="M36 48 Q 45 46, 50 50 Q 42 58, 36 48 Z" fill="#4ade80"/>
  </g>

  <!-- Lupa derecha -->
  <g transform="translate(295, 110)" filter="url(#cardShadow)">
    <circle cx="30" cy="30" r="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="30" cy="30" r="18" fill="#ffffff" opacity="0.6"/>
    <!-- Brillo -->
    <path d="M20 20 A 14 14 0 0 1 36 18" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Mango -->
    <line x1="46" y1="46" x2="68" y2="68" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <line x1="46" y1="46" x2="52" y2="52" stroke="#ea580c" stroke-width="8"/>
  </g>
</svg>
