<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="solBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="solFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#solBg)"/>

  <!-- Rayos de sol -->
  <g transform="translate(80, 80)">
    <!-- 8 Rayos gruesos y redondeados -->
    <rect x="-6" y="-55" width="12" height="18" rx="6" fill="#f59e0b"/>
    <rect x="-6" y="37" width="12" height="18" rx="6" fill="#f59e0b"/>
    <rect x="-55" y="-6" width="18" height="12" rx="6" fill="#f59e0b"/>
    <rect x="37" y="-6" width="18" height="12" rx="6" fill="#f59e0b"/>

    <g transform="rotate(45)">
      <rect x="-5" y="-53" width="10" height="16" rx="5" fill="#fbbf24"/>
      <rect x="-5" y="37" width="10" height="16" rx="5" fill="#fbbf24"/>
      <rect x="-53" y="-5" width="16" height="10" rx="5" fill="#fbbf24"/>
      <rect x="37" y="-5" width="16" height="10" rx="5" fill="#fbbf24"/>
    </g>

    <!-- Rostro del Sol -->
    <circle cx="0" cy="0" r="36" fill="url(#solFace)"/>

    <!-- Ojos alegres -->
    <circle cx="-12" cy="-5" r="3.5" fill="#1e293b"/>
    <circle cx="-10.5" cy="-6" r="1.2" fill="#ffffff"/>
    <circle cx="12" cy="-5" r="3.5" fill="#1e293b"/>
    <circle cx="13.5" cy="-6" r="1.2" fill="#ffffff"/>

    <!-- Mejillas rosadas -->
    <ellipse cx="-18" cy="4" rx="4" ry="2.5" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="18" cy="4" rx="4" ry="2.5" fill="#f43f5e" opacity="0.4"/>

    <!-- Sonrisa amplia -->
    <path d="M -10 6 Q 0 18, 10 6" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
