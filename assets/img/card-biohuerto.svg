<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Fondo suave -->
  <rect width="400" height="240" rx="20" fill="url(#skyGrad)"/>

  <!-- Sol radiante -->
  <circle cx="340" cy="50" r="32" fill="url(#sunGrad)" opacity="0.9"/>
  <circle cx="340" cy="50" r="42" fill="#fef08a" opacity="0.35"/>

  <!-- Nube suave -->
  <path d="M50 60 a18 18 0 0 1 32 -6 a24 24 0 0 1 42 6 a16 16 0 0 1 -6 32 h-62 a16 16 0 0 1 -6 -32 z" fill="#ffffff" opacity="0.8"/>

  <!-- Cajón de cultivo / Bancal de madera -->
  <g filter="url(#softShadow)">
    <rect x="40" y="150" width="320" height="70" rx="10" fill="url(#woodGrad)"/>
    <rect x="35" y="145" width="330" height="15" rx="5" fill="#f59e0b"/>
    <rect x="48" y="160" width="304" height="25" rx="6" fill="url(#soilGrad)"/>
  </g>

  <!-- Brote izquierdo -->
  <g transform="translate(85, 115)">
    <path d="M15 45 Q 15 20, 2 12 C 12 10, 22 18, 17 45 Z" fill="url(#leafGrad)"/>
    <path d="M15 45 Q 15 15, 30 10 C 28 22, 18 25, 15 45 Z" fill="#86efac"/>
    <circle cx="15" cy="45" r="4" fill="#78350f"/>
  </g>

  <!-- Zanahoria sonriente en el centro -->
  <g transform="translate(160, 95)" filter="url(#softShadow)">
    <!-- Hojas de la zanahoria -->
    <path d="M25 35 C 20 15, 10 5, 5 2 C 15 10, 20 22, 23 35 Z" fill="url(#leafGrad)"/>
    <path d="M25 35 C 25 10, 25 0, 25 -2 C 28 8, 28 20, 27 35 Z" fill="#22c55e"/>
    <path d="M25 35 C 30 15, 40 5, 45 2 C 35 10, 30 22, 27 35 Z" fill="url(#leafGrad)"/>

    <!-- Cuerpo de zanahoria -->
    <path d="M12 35 C 10 32, 40 32, 38 35 C 36 60, 28 90, 25 98 C 22 90, 14 60, 12 35 Z" fill="url(#carrotGrad)"/>
    <!-- Rayitas de textura -->
    <line x1="16" y1="48" x2="24" y2="48" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="62" x2="34" y2="62" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
    <line x1="19" y1="76" x2="27" y2="76" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
    <!-- Ojos tiernos -->
    <circle cx="20" cy="44" r="2.5" fill="#1e293b"/>
    <circle cx="30" cy="44" r="2.5" fill="#1e293b"/>
    <path d="M22 51 Q 25 55, 28 51" stroke="#1e293b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Lechuga / Planta frondosa derecha -->
  <g transform="translate(230, 105)">
    <circle cx="30" cy="40" r="24" fill="#22c55e"/>
    <circle cx="16" cy="38" r="18" fill="#4ade80"/>
    <circle cx="44" cy="38" r="18" fill="#16a34a"/>
    <circle cx="30" cy="26" r="16" fill="#86efac"/>
    <circle cx="30" cy="36" r="12" fill="#bbf7d0"/>
  </g>

  <!-- Regadera azul brillante -->
  <g transform="translate(290, 110)" filter="url(#softShadow)">
    <!-- Cuerpo -->
    <rect x="20" y="25" width="45" height="35" rx="10" fill="url(#canGrad)"/>
    <!-- Pico vertedor -->
    <polygon points="20,45 0,25 0,18 20,38" fill="url(#canGrad)"/>
    <ellipse cx="2" cy="21" rx="5" ry="9" fill="#0284c7"/>
    <!-- Asa -->
    <path d="M65 32 C 80 32, 80 55, 65 55" stroke="url(#canGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Gotitas de agua -->
    <circle cx="-10" cy="38" r="3" fill="#38bdf8"/>
    <circle cx="-16" cy="48" r="2.5" fill="#38bdf8"/>
    <circle cx="-6" cy="54" r="2" fill="#38bdf8"/>
  </g>
</svg>
