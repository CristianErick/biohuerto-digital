<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="gameShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#7c2d12" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="240" rx="20" fill="url(#gameBg)"/>

  <!-- Estrellas y destellos de fondo -->
  <polygon points="60,50 64,60 74,64 64,68 60,78 56,68 46,64 56,60" fill="#f59e0b"/>
  <polygon points="340,40 343,48 351,51 343,54 340,62 337,54 329,51 337,48" fill="#f59e0b"/>
  <polygon points="350,160 353,168 361,171 353,174 350,182 347,174 339,171 347,168" fill="#fbbf24"/>
  <circle cx="75" cy="170" r="16" fill="url(#goldGrad)" opacity="0.8"/>
  <circle cx="75" cy="170" r="12" fill="#fef08a"/>
  <text x="71" y="176" font-family="sans-serif" font-weight="bold" font-size="16" fill="#b45309">★</text>

  <!-- Pieza de Puzzle 1 (Cian / Azul) Izquierda -->
  <g transform="translate(60, 85)" filter="url(#gameShadow)">
    <path d="M 10 10 H 35 A 8 8 0 0 1 51 10 H 76 V 35 A 8 8 0 0 0 76 51 V 76 H 51 A 8 8 0 0 0 35 76 H 10 V 51 A 8 8 0 0 1 10 35 Z" fill="#0284c7"/>
  </g>

  <!-- Pieza de Puzzle 2 (Rojo / Coral) Derecha -->
  <g transform="translate(265, 55)" filter="url(#gameShadow)">
    <path d="M 10 10 H 35 A 8 8 0 0 0 51 10 H 76 V 35 A 8 8 0 0 1 76 51 V 76 H 51 A 8 8 0 0 1 35 76 H 10 V 51 A 8 8 0 0 0 10 35 Z" fill="#f43f5e"/>
  </g>

  <!-- Control de Videojuego Central -->
  <g transform="translate(130, 75)" filter="url(#gameShadow)">
    <!-- Cuerpo del control -->
    <path d="M 25 35 C 10 35, 0 55, 0 85 C 0 115, 20 135, 45 125 L 60 100 L 80 100 L 95 125 C 120 135, 140 115, 140 85 C 140 55, 130 35, 115 35 Z" fill="url(#ctrlGrad)"/>
    <!-- Brillo superior -->
    <path d="M 30 42 C 45 38, 95 38, 110 42" stroke="#c4b5fd" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Cruceta direccional (D-pad) -->
    <g transform="translate(25, 60)">
      <rect x="8" y="0" width="10" height="26" rx="2" fill="#1e1b4b"/>
      <rect x="0" y="8" width="26" height="10" rx="2" fill="#1e1b4b"/>
      <circle cx="13" cy="13" r="3" fill="#312e81"/>
    </g>

    <!-- Botones de Acción (Coloridos) -->
    <g transform="translate(90, 60)">
      <circle cx="14" cy="5"  r="5" fill="#facc15"/> <!-- Amarillo -->
      <circle cx="5"  cy="14" r="5" fill="#38bdf8"/> <!-- Azul -->
      <circle cx="23" cy="14" r="5" fill="#f43f5e"/> <!-- Rojo -->
      <circle cx="14" cy="23" r="5" fill="#22c55e"/> <!-- Verde -->
    </g>

    <!-- Botones centrales -->
    <rect x="54" y="68" width="12" height="5" rx="2.5" fill="#1e1b4b"/>
    <rect x="74" y="68" width="12" height="5" rx="2.5" fill="#1e1b4b"/>

    <!-- Pantallita o luz LED de estado -->
    <circle cx="70" cy="52" r="3" fill="#4ade80"/>
  </g>

  <!-- Trofeo dorado pequeño flotante -->
  <g transform="translate(270, 135)" filter="url(#gameShadow)">
    <path d="M15 10 L45 10 L40 35 C 38 45, 22 45, 20 35 Z" fill="url(#goldGrad)"/>
    <path d="M15 16 C 5 16, 5 28, 17 28" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M45 16 C 55 16, 55 28, 43 28" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <rect x="26" y="38" width="8" height="12" fill="#b45309"/>
    <rect x="18" y="48" width="24" height="8" rx="2" fill="#78350f"/>
  </g>
</svg>
