; Configuración PHP para producción (Docker / Vercel)
; Se copia a /usr/local/etc/php/conf.d/ dentro de la imagen.

; Configurar sesiones en base de datos antes de session_start()
auto_prepend_file=/app/config/prepend.php

display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/proc/self/fd/2
expose_php=Off

; Límites de subida (el repositorio acepta hasta 15 MB)
upload_max_filesize=20M
post_max_size=21M
max_execution_time=60
max_input_time=60
memory_limit=256M

; Sesiones seguras
session.cookie_httponly=1
session.use_strict_mode=1
session.gc_maxlifetime=1440
